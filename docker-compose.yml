services:
  # ============================================================================
  # Infrastructure Services
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: order_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: "order_db,product_db,inventory_db,payment_db"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - platform_net

  mongodb:
    image: mongo:7.0
    container_name: order_platform_mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - platform_net

  redis:
    image: redis:7.2-alpine
    container_name: order_platform_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - platform_net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: order_platform_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Management Web UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 8s
      timeout: 5s
      retries: 10
    networks:
      - platform_net

  # ============================================================================
  # Application Microservices
  # ============================================================================
  product-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product_service
    restart: unless-stopped
    command: ["uvicorn", "services.product_service.main:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - POSTGRES_HOST=postgres
      - PRODUCT_DB_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/product_db
      - REDIS_URL=redis://redis:6379/0
      - PRODUCT_SERVICE_PORT=8002
      - PRODUCT_SERVICE_GRPC_PORT=50052
    ports:
      - "8002:8002"
      - "50052:50052"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - platform_net

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory_service
    restart: unless-stopped
    command: ["uvicorn", "services.inventory_service.main:app", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - POSTGRES_HOST=postgres
      - INVENTORY_DB_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/inventory_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - INVENTORY_SERVICE_PORT=8003
      - INVENTORY_SERVICE_GRPC_PORT=50053
    ports:
      - "8003:8003"
      - "50053:50053"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - platform_net

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment_service
    restart: unless-stopped
    command: ["uvicorn", "services.payment_service.main:app", "--host", "0.0.0.0", "--port", "8004"]
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - POSTGRES_HOST=postgres
      - PAYMENT_DB_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/payment_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - PAYMENT_SERVICE_PORT=8004
      - PAYMENT_SERVICE_GRPC_PORT=50054
    ports:
      - "8004:8004"
      - "50054:50054"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - platform_net

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order_service
    restart: unless-stopped
    command: ["uvicorn", "services.order_service.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - POSTGRES_HOST=postgres
      - ORDER_DB_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/order_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - REDIS_URL=redis://redis:6379/0
      - PRODUCT_SERVICE_HOST=product-service
      - PRODUCT_SERVICE_GRPC_PORT=50052
      - ORDER_SERVICE_PORT=8001
      - ORDER_SERVICE_GRPC_PORT=50051
    ports:
      - "8001:8001"
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      product-service:
        condition: service_started
    networks:
      - platform_net

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification_service
    restart: unless-stopped
    command: ["uvicorn", "services.notification_service.main:app", "--host", "0.0.0.0", "--port", "8005"]
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - MONGODB_URL=mongodb://mongodb:27017
      - NOTIFICATION_DB_NAME=notification_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - NOTIFICATION_SERVICE_PORT=8005
    ports:
      - "8005:8005"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - platform_net

  audit-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audit_service
    restart: unless-stopped
    command: ["uvicorn", "services.audit_service.main:app", "--host", "0.0.0.0", "--port", "8006"]
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - MONGODB_URL=mongodb://mongodb:27017
      - AUDIT_DB_NAME=audit_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - AUDIT_SERVICE_PORT=8006
    ports:
      - "8006:8006"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - platform_net

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_gateway
    restart: unless-stopped
    command: ["uvicorn", "services.api_gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      - ORDER_SERVICE_HOST=order-service
      - ORDER_SERVICE_PORT=8001
      - PRODUCT_SERVICE_HOST=product-service
      - PRODUCT_SERVICE_PORT=8002
      - INVENTORY_SERVICE_HOST=inventory-service
      - INVENTORY_SERVICE_PORT=8003
      - PAYMENT_SERVICE_HOST=payment-service
      - PAYMENT_SERVICE_PORT=8004
      - NOTIFICATION_SERVICE_HOST=notification-service
      - NOTIFICATION_SERVICE_PORT=8005
      - AUDIT_SERVICE_HOST=audit-service
      - AUDIT_SERVICE_PORT=8006
    ports:
      - "8000:8000"
    depends_on:
      - order-service
      - product-service
      - inventory-service
      - payment-service
      - notification-service
      - audit-service
    networks:
      - platform_net

  nginx:
    image: nginx:1.25-alpine
    container_name: order_platform_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - platform_net

# ==============================================================================
# Persistent Volumes & Networks
# ==============================================================================
volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data:

networks:
  platform_net:
    driver: bridge
