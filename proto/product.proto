syntax = "proto3";

package product;

import "common.proto";

service ProductService {
  rpc GetProduct (GetProductRequest) returns (ProductResponse);
  rpc ValidateProducts (ValidateProductsRequest) returns (ValidateProductsResponse);
}

message GetProductRequest {
  string product_id = 1;
}

message ProductResponse {
  string product_id = 1;
  string name = 2;
  string sku = 3;
  double price = 4;
  string currency = 5;
  bool is_active = 6;
}

message ValidateItem {
  string product_id = 1;
  int32 quantity = 2;
}

message ValidateProductsRequest {
  repeated ValidateItem items = 1;
}

message ValidatedProductDetail {
  string product_id = 1;
  string name = 2;
  double price = 3;
  bool is_valid = 4;
  string error_message = 5;
}

message ValidateProductsResponse {
  bool all_valid = 1;
  repeated ValidatedProductDetail items = 2;
  double total_amount = 3;
}
